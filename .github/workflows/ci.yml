name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'portfolio/**']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  sri-audit-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/sri-audit/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: examples/sri-audit
      - run: npx playwright install --with-deps chromium
        working-directory: examples/sri-audit
      - run: npm run verify
        working-directory: examples/sri-audit
